<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F5">
<title>Rick工作台</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="app">
  <!-- 桌面端侧边导航 -->
  <aside id="sidebar" aria-label="主导航">
    <div class="side-brand">
      <span class="side-logo" aria-hidden="true">R</span>
      <span class="side-title">Rick工作台</span>
    </div>
    <nav id="side-nav" class="side-nav"></nav>
    <div class="side-foot">
      <span id="side-sync-hint" class="side-hint">数据保存在本机浏览器</span>
    </div>
  </aside>

  <!-- 移动端顶栏 -->
  <header id="topbar">
    <button id="topbar-menu" class="icon-btn" aria-label="打开菜单"></button>
    <h1 id="topbar-title">今日</h1>
    <button id="topbar-search" class="icon-btn" aria-label="搜索"></button>
  </header>

  <!-- 主内容区 -->
  <main id="main" tabindex="-1">
    <div id="view" aria-live="polite"></div>
  </main>

  <!-- 移动端底部导航 -->
  <nav id="bottom-nav" aria-label="底部导航"></nav>

  <!-- 弹层容器 -->
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="assertive"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
